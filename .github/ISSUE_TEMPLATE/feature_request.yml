name: Feature request
description: 提出功能或体验改进建议
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 Issue，并说明这个建议解决什么问题，而不只是描述实现方式。涉及角色美术、第三方素材或商业用途的请求请先阅读 `LICENSE-ASSETS` 与 `docs/assets.md`。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前体验哪里不方便？在什么场景下出现？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以描述交互、设置项或模块行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些其他做法？
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      options:
        - 宠物交互 / 气泡
        - 设置页
        - 模块（番茄钟、提醒、天气、Claude Code 等）
        - 打包 / 安装 / 数据
        - 文档 / 开发体验
        - 不确定
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，未找到相同建议。
          required: true
        - label: 该建议不要求提交未授权的角色美术或游戏内提取素材。
          required: true
