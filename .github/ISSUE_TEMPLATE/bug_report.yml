name: Bug report
description: 报告可复现的问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索现有 Issue。请勿粘贴密钥、完整日志或包含本机用户名/项目名的路径；必要时先脱敏。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 设置页显示的版本号，或 Release 文件名
      placeholder: v1.0.0
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: 构建来源
      options:
        - 官方 Release 安装包
        - 从源码构建
        - 其他（请在描述中说明）
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本与缩放
      placeholder: Windows 11 24H2 x64，125%
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量给出最小复现步骤
      placeholder: |
        1. 打开…
        2. 点击…
        3. 看到…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的日志（可选）
      description: 日志在 `%APPDATA%\vivian-desktop-pet\logs\`。请删除本机用户名、项目名与其他隐私信息。
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，未找到相同问题。
          required: true
        - label: 我已移除日志与截图中的密钥、本机路径和项目名。
          required: true
